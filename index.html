let currentIndex = 0;
let timerSeconds = 60;
let timerInterval = null;
let isTimerRunning = false;

function nextWord() {
  currentIndex = Math.floor(Math.random() * wordData.length);
  document.getElementById("target-word").innerText = wordData[currentIndex].word;
  document.getElementById("item-counter").innerText = `お題 ${currentIndex + 1} / ${wordData.length}`;
  document.getElementById("answer-box").innerHTML = wordData[currentIndex].hint;
  document.getElementById("answer-box").style.display = "none";
  resetTimer();
}

function toggleAnswer() {
  const box = document.getElementById("answer-box");
  box.style.display = (box.style.display === "block") ? "none" : "block";
}

function toggleTimer() {
  if (isTimerRunning) {
    clearInterval(timerInterval);
    isTimerRunning = false;
    document.getElementById("timer-btn").innerText = "タイマー再開";
  } else {
    isTimerRunning = true;
    document.getElementById("timer-btn").innerText = "一時停止";
    timerInterval = setInterval(() => {
      timerSeconds--;
      let mins = String(Math.floor(timerSeconds / 60)).padStart(2, '0');
      let secs = String(timerSeconds % 60).padStart(2, '0');
      document.getElementById("timer").innerText = `${mins}:${secs}`;
      if (timerSeconds <= 0) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        alert("1分経過！思考を終えて発表を始めてください。");
      }
    }, 1000);
  }
}

function resetTimer() {
  clearInterval(timerInterval);
  isTimerRunning = false;
  timerSeconds = 60;
  document.getElementById("timer").innerText = "01:00";
  document.getElementById("timer-btn").innerText = "1分思考タイマー開始";
}

// 初期化表示
document.getElementById("target-word").innerText = wordData[0].word;
document.getElementById("answer-box").innerHTML = wordData[0].hint;
document.getElementById("item-counter").innerText = `お題 1 / ${wordData.length}`;
</script>
